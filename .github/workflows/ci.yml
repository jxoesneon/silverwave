name: CI — DocDD, TDD & Coverage Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test-matrix:
    name: Rust Workspace Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Workspace Tests (std + no_std core)
        run: |
          cargo test -p silverwave-core -p silverwave-mini -p silverwave-dsp -p silverwave-io -p silverwave-viz -p silverwave-gui -p silverwave-wasm -p silverwave-lsp -p silverwave-plugin -p silverwave-mcp -p silverwave-cli --all-targets
          cargo test --workspace --all-targets
          cargo check -p silverwave-core --no-default-features
          cargo check -p silverwave-mini --no-default-features

  coverage-gate:
    name: silverwave >= 99.5% Line Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate lcov report
        run: cargo llvm-cov --package silverwave-core --package silverwave-mini --package silverwave-dsp --package silverwave-io --package silverwave-viz --package silverwave-gui --package silverwave-wasm --package silverwave-lsp --package silverwave-plugin --package silverwave-mcp --package silverwave-cli --lcov --output-path lcov.info
      - name: Generate JSON segment report
        run: cargo llvm-cov --package silverwave-core --package silverwave-mini --package silverwave-dsp --package silverwave-io --package silverwave-viz --package silverwave-gui --package silverwave-wasm --package silverwave-lsp --package silverwave-plugin --package silverwave-mcp --package silverwave-cli --json --output-path cov.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            lcov.info
            cov.json
      - name: Verify >= 99.5% Line Coverage on Implemented Crates
        run: cargo llvm-cov --package silverwave-core --package silverwave-mini --package silverwave-dsp --package silverwave-io --package silverwave-viz --package silverwave-gui --package silverwave-wasm --package silverwave-lsp --package silverwave-plugin --package silverwave-mcp --package silverwave-cli --fail-under-lines 99.5 --show-missing-lines
