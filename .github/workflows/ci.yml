name: CI — DocDD, TDD & Coverage Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test-matrix:
    name: Rust Workspace Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Workspace Tests (std + no_std core)
        run: |
          cargo test --workspace --all-targets
          cargo check -p silverwave-core --no-default-features
          cargo check -p silverwave-mini --no-default-features

  coverage-gate:
    name: silverwave-core >= 99.5% Line Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Verify >= 99.5% Line Coverage on silverwave-core
        run: cargo llvm-cov --package silverwave-core --package silverwave-mini --fail-under-lines 99.5
